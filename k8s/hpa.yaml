apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ml-serving-hpa
  namespace: ml-training
spec:
  # The target to scale (your Deployment)
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ml-serving-deployment
    
  # Scaling limits
  minReplicas: 2
  maxReplicas: 5
  
  # Metrics that trigger a scale-up
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        # Scale up if the average CPU usage across all pods exceeds 70% of the requested CPU
        averageUtilization: 70